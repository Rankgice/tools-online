name: Build image

# 注意: 这个 workflow 假设 tools-online 已经是一个独立仓库的根目录。
# 当前它还放在 polaris monorepo 的子目录里, 所以这个文件不会被 GitHub Actions 真正触发;
# 等 tools-online 拆成独立 repo 后, .github/workflows 自然就在 repo 根下生效。

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# 取消同分支上的旧构建, 节省 CI 时间
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write   # 推到 GHCR 需要

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 计算镜像 tag:
      #   - branch 名 (main 等)
      #   - sha-xxxxxx (7 位 commit sha)
      #   - default branch 同时打 latest
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # github.repository = <owner>/<repo>, 这里 repo 就是 tools-online
          # 最终镜像名形如 ghcr.io/<owner>/tools-online
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # PR 只构建不推送; 合并/push 才推到 registry
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA 缓存, 加速重复构建
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ============================================================================
# 如果要改推到 harbor.yuansuan.cn (与 portal/org 等服务镜像同一注册中心),
# 在仓库 Settings → Secrets 加上:
#   HARBOR_REGISTRY  = harbor.yuansuan.cn
#   HARBOR_USERNAME
#   HARBOR_PASSWORD
# 然后把上面两处改为:
#   metadata-action images:  ${{ secrets.HARBOR_REGISTRY }}/sme/tools-online
#   login-action:
#     registry: ${{ secrets.HARBOR_REGISTRY }}
#     username: ${{ secrets.HARBOR_USERNAME }}
#     password: ${{ secrets.HARBOR_PASSWORD }}
# ============================================================================
